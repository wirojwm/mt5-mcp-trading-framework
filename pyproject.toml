[project]
name = "mt5-mcp-trading"
version = "0.1.0"
description = "Clean-architecture MT5 trading system built around an MCP adapter boundary. The legacy project (2509_17_mix_supercross) is read-only reference only, not a dependency."
# Pinned to exactly 3.12.x: metatrader-mcp-server==0.5.1 requires >=3.10, and 3.12 is the
# single runtime this project standardizes on across both development machines (see
# .python-version and README.md Setup). Do not widen without re-verifying on both machines.
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Runtime and dev dependencies are pinned in requirements.txt/requirements-dev.txt, the
# source of truth for install versions (see README.md Setup) -- kept out of `dependencies`
# above to avoid maintaining the same version strings in two places. This extra exists only
# so `pip install -e ".[dev]"` works for anyone who reaches for it out of habit; it must be
# kept in sync with requirements-dev.txt by hand.
#
# metatrader-mcp-server can place, modify, and close real orders once connected to an
# account (see src/mt5_mcp_trading/mcp_adapter/ and scripts/run_metatrader_mcp_stdio.py for
# how this project constrains that). Installing it does not, by itself, enable any trading
# capability in this codebase.
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
