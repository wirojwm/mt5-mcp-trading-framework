[project]
name = "mt5-mcp-trading"
version = "0.1.0"
description = "Clean-architecture MT5 trading system built around an MCP adapter boundary. The legacy project (2509_17_mix_supercross) is read-only reference only, not a dependency."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
